<html lang="pl">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zamek Bukowiec – Pokoje z widokiem na Bieszczady</title>
    <meta name="description" content="Obiekt Zamek w Bukowcu (Podkarpackie). Pokoje z widokiem na rzekę i góry, ogród, bezpłatny parking, Wi-Fi. 300 m od centrum, 8 km od Bieszczadzkiego Parku Narodowego." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body class="bg-background text-foreground-body font-body antialiased selection:bg-brand-brown selection:text-white">
